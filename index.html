<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-title">
      <span class="globe-icon">🌐</span>
      <h1>Country Explorer</h1>
    </div>
  </header>

  <main class="main-container">
    <section class="filters-section">
      <div class="filter-group">
        <label for="search-input">Search by Country Name:</label>
        <input type="text" id="search-input" placeholder="Search by Country Name..." />
      </div>

      <div class="filter-group">
        <label for="region-select">Select a Region:</label>
        <select id="region-select">
          <option value="all">All Regions</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Africa">Africa</option>
          <option value="Oceania">Oceania</option>
          <option value="Americas">Americas</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="population-input">Search by Population:</label>
        <input type="number" id="population-input" placeholder="0" min="0" />
        <span class="subtext">Max - 1.5 Billion (1500000000)</span>
      </div>
    </section>

    <div id="country-cards-container"></div>

    <div class="btn-container">
      <button id="show-more-btn" class="show-more-btn">Show More</button>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // Fetch data from your local backend endpoint
    fetch('/countries')
      .then(response => response.json())
      .then(data => {
        console.log('Backend connection successful! Data received:', data);
        alert('Backend is working! Check your browser console for the country objects.');
      })
      .catch(error => {
        console.error('Failed to connect to backend:', error);
      });
  </script>
</body>
</html>
